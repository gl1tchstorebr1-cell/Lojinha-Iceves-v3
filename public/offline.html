<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Modo Offline — Lojinha Iceves</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #141414;
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 20px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        background: #ffffff;
        padding: 2px;
        border: 2px solid rgba(16, 185, 129, 0.5);
        margin-bottom: 14px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        color: #fbbf24;
        background: rgba(245, 158, 11, 0.14);
        border: 1px solid rgba(245, 158, 11, 0.35);
        padding: 4px 10px;
        border-radius: 999px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px 0;
      }
      p {
        font-size: 13px;
        color: #a1a1aa;
        line-height: 1.5;
        margin: 0 0 20px 0;
      }
      button {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(90deg, #10b981, #0d9488);
        color: #ffffff;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/pwa-192x192.png" alt="Lojinha Iceves" />
      <div class="badge">Sem Conexão com a Internet</div>
      <h1>Lojinha Iceves — Modo Offline</h1>
      <p>
        Não foi possível alcançar o servidor no momento. Vendas, pagamentos e baixas de estoque são bloqueados offline para garantir segurança financeira.
      </p>
      <button onclick="window.location.reload()">Tentar Reconectar</button>
    </div>
  </body>
</html>
